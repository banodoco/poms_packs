schema_version: 1
id: chapter-card
kind: effect
pack_id: astrid_video
short_description: Minimal Astrid chapter title with stepped pixel accents.
description: Full-frame typography and restrained pixel geometry for section openings.
  Clip-local entrance, then a stable hold. No media assets or external fonts required.
keywords:
- title
- chapter
- typography
- pixel
- astrid-video
metadata:
  label: Astrid Chapter Card
  whenToUse: Introduce an experiment or new section with a concise chapter title.
  clipTypeAliases:
  - astrid-video-chapter-card
  role: title
  geometry:
    full_frame: true
  text: titleLines
  sourceClosureSha256: sha256:84b7a2ef5af5c5e75d36a36ced09bfa9483630cd78fcb72067cbedd7af9379b3
defaults:
  theme: day
  series: ASTRID / FIELD NOTES
  chapter: '01'
  titleLines:
  - The experiment.
  subtitle: An experiment in creative direction.
  entranceSeconds: 0.46
  seed: 17
schema:
  type: object
  additionalProperties: false
  properties:
    theme:
      type: string
      enum:
      - day
      - night
      description: Editorial day or night palette. Explicit colour overrides take
        precedence.
    series:
      type: string
      maxLength: 60
    chapter:
      type: string
      maxLength: 8
    titleLines:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: string
        minLength: 1
        maxLength: 40
    subtitle:
      type: string
      maxLength: 90
    entranceSeconds:
      type: number
      minimum: 0
      maximum: 2
    seed:
      type: integer
    background:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
    foreground:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
    accent:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
runtime:
  adapter: remotion
dependencies: {}
