schema_version: 1
id: pixel-card-shuffle
kind: effect
pack_id: astrid_video
short_description: Media cards with a crawling reveal, living pixel carriers and configurable
  layouts.
description: Ordered image/video montage with a travelling pixel front that uncovers
  the next card over the outgoing card. The outgoing final frame holds during the
  reveal. Use an ordered list of declared pack asset keys. A single managed asset
  can use the card framing without a transition. Living carry mode transports cards
  into independently specified rectangles; hold mode presents several cards on pixel
  tendrils. Audio is muted intentionally; mix narration and effects separately.
keywords:
- montage
- shuffle
- pixel
- remotion
- astrid-video
metadata:
  label: Pixel Card Shuffle
  whenToUse: Show a fast sequence of source shots, references or generation results
    during an Astrid explainer.
  clipTypeAliases:
  - pixel-card-shuffle
  role: card
  geometry:
    full_frame: true
  sourceClosureSha256: sha256:1e628ecbe485a0e2e0fd9712583326f4db63df161cc0469d37f226cacc5de8f3
defaults:
  theme: day
  transitionSeconds: 0.42
  inset: 0.055
  drift: 1
  pixelSize: 16
  seed: 17
  showCounter: false
  fit: cover
  direction: left-to-right
  sparkDensity: 0.1
  randomness: 0.7
  crawlStyle: ragged
  edgeReveal: true
  restJitter: 0
schema:
  type: object
  additionalProperties: false
  properties:
    theme:
      type: string
      enum:
      - day
      - night
      description: Editorial day or night palette. Explicit colour overrides take
        precedence.
    transitionSeconds:
      type: number
      minimum: 0
      maximum: 1.2
    inset:
      type: number
      minimum: 0.025
      maximum: 0.18
    drift:
      type: number
      minimum: 0
      maximum: 1.5
    pixelSize:
      type: number
      minimum: 8
      maximum: 100
    seed:
      type: integer
    background:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
    accent:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
    frameColor:
      type: string
      pattern: ^#[0-9a-fA-F]{6}$
    showCounter:
      type: boolean
    fit:
      type: string
      enum:
      - cover
      - contain
    cardIndex:
      type: integer
      minimum: 0
    direction:
      type: string
      enum:
      - left-to-right
      - right-to-left
      - top-to-bottom
      - bottom-to-top
      - alternate
    directions:
      type: array
      description: Optional per-transition directions for incoming cards. directions[0]
        controls the second card reveal, directions[1] the third, and so on.
      items:
        type: string
        enum:
        - left-to-right
        - right-to-left
        - top-to-bottom
        - bottom-to-top
        - alternate
    transitionDurations:
      type: array
      description: Optional reveal durations in seconds, one per incoming card after
        the first. Zero is a hard cut; absent entries use transitionSeconds. Short
        card holds cap the transition.
      items:
        type: number
        minimum: 0
        maximum: 1.2
    crawlStyle:
      type: string
      enum:
      - clean
      - ragged
      - noisy
      - chunky
      description: Default pixel-front texture. Chunky uses larger tiles, noisy uses
        finer and more scattered teeth.
    crawlStyles:
      type: array
      description: Optional texture per incoming card after the first; absent entries
        use crawlStyle.
      items:
        type: string
        enum:
        - clean
        - ragged
        - noisy
        - chunky
    sparkDensity:
      type: number
      minimum: 0
      maximum: 0.5
    randomness:
      type: number
      minimum: 0
      maximum: 1.5
      description: Zero is a straight pixel front; higher values increase spatial
        irregularity without unrevealing pixels.
    presentation:
      type: string
      enum:
      - classic
      - carry
      - hold
      description: Classic is the original full-canvas shuffle; carry moves one card
        at a time; hold assembles a tableau. If omitted, a card layout selects carry,
        otherwise classic.
    organism:
      type: string
      enum:
      - swarm
      - tendrils
      - none
      description: Living support form; carry defaults to swarm, hold to tendrils.
        None disables living pixels, not the reveal.
    organismIntensity:
      type: number
      minimum: 0
      maximum: 1
      description: Density of the living support; zero removes it.
    organismPixelSize:
      type: number
      minimum: 3
      maximum: 18
      description: Square living pixels on a 720px short edge. Fine cells default
        to 3.
    organismSpread:
      type: number
      minimum: 0
      maximum: 1
      description: Swarm apron and scout spread around all sides of the load; default
        0.62.
    organismFlow:
      type: number
      minimum: 0
      maximum: 2
      description: Internal swimming speed; zero pauses internal flow, not transport.
    arrivalSeconds:
      type: number
      minimum: 0
      maximum: 1.8
      description: First card arrival in carry mode or each arrival in hold mode.
        Capped by available frames.
    staggerSeconds:
      type: number
      minimum: 0
      maximum: 1.2
      description: Delay between tableau arrivals in hold mode.
    cards:
      type: array
      minItems: 1
      description: Ordered declared pack asset keys. Add/remove/reorder items without
        changing the component; adding new source bytes requires declaration and readmission.
      items:
        type: object
        additionalProperties: false
        required:
        - asset
        - kind
        properties:
          asset:
            type: string
            minLength: 1
          kind:
            type: string
            enum:
            - image
            - video
          weight:
            type: number
            exclusiveMinimum: 0
          sourceStart:
            type: number
            minimum: 0
          label:
            type: string
          fit:
            type: string
            enum:
            - cover
            - contain
            description: Per-card fit in living modes.
          layout:
            type: object
            additionalProperties: false
            required:
            - x
            - y
            - width
            - height
            description: Final normalized canvas rectangle. x and y are top-left;
              width and height are independent canvas fractions. Must fit in the canvas.
              Used by carry and hold modes.
            properties:
              x:
                type: number
                minimum: 0
                maximum: 1
              y:
                type: number
                minimum: 0
                maximum: 1
              width:
                type: number
                minimum: 0.035
                maximum: 1
              height:
                type: number
                minimum: 0.035
                maximum: 1
          grip:
            type: number
            minimum: 0.12
            maximum: 0.88
            description: Horizontal fraction along the lower edge where a tendril
              supports the load; default center.
    restJitter:
      type: number
      minimum: 0
      maximum: 1
      description: 'Living modes: bounded, seeded resting motion of the load around
        its authored rectangle. Zero locks the load; final held frame returns to target.
        Independent of organismFlow.'
    edgeReveal:
      type: boolean
      description: 'Living modes: true crawls a pixel reveal across arriving content;
        false moves an intact card in from and out to the edge of the canvas. Transition
        timing still applies. False selects carry if no presentation is specified.'
    mediaBindings:
      type: object
      maxProperties: 128
      description: Logical media slot to existing authorized timeline registry key.
        Requires native managed-element-media host support. No paths, URLs or bytes.
      propertyNames:
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 256
assets:
  room: assets/room.png
  storyboard: assets/storyboard.png
  mink: assets/mink.png
  portal: assets/portal.mp4
  landscape: assets/landscape.png
  ascent: assets/ascent.mp4
runtime:
  adapter: remotion
dependencies: {}
