schema_version: 3
pack_api: "2.0"
id: youtube
name: Astrid YouTube
version: 1.0.0
status: active
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs yt-dlp for audio acquisition.
  - id: network
    reason: Downloads YouTube media through the host-managed youtube-media broker.
  - id: project_files
    reason: Writes downloaded audio and video.
description: Acquire YouTube media (audio MP3 / video MP4 via yt-dlp).
keywords:
- youtube
- yt-dlp
- download
- audio
- mp3
capabilities:
- download_youtube_audio
- download_youtube_video
agent:
  purpose: Choose this pack to fetch a YouTube video's audio or video (by search query or URL) for downstream use.
  do_not_use_for: Do not use to edit, render, or analyze the video itself (use video_editing or understanding); this pack only ingests.
  normal_entrypoints:
  - youtube.youtube_audio
documentation:
  kind: skill
  path: docs/SKILL.md
actions:
  youtube_audio:
    name: YouTube Audio
    version: "0.1.0"
    short_description: Download a YouTube video's audio (MP3) or video (MP4) — by search query or direct URL.
    description: Wraps yt-dlp to fetch the top YouTube search result or a direct HTTP(S) URL supplied through query, in audio-extraction mode (MP3) or raw-video mode (MP4).
    keywords:
      - youtube
      - audio
      - video
      - download
      - yt-dlp
      - mp3
      - mp4
      - music
      - search
    invocation:
      kind: command
      command:
        argv:
          - "{python_exec}"
          - -m
          - astrid.packs.youtube.actions.youtube_audio.run
          - --query
          - "{query}"
          - --mode
          - "{mode}"
          - --out
          - "{out}/media"
    inputs:
      - name: query
        type: string
        required: true
        description: Free-text YouTube search query, or a direct HTTP(S) YouTube URL.
      - name: mode
        type: string
        required: false
        default: audio
        description: "audio (default — extract to MP3) or video (download MP4 without audio extraction)."
    outputs:
      - name: media
        type: file
        artifact_type: media
        mode: create_or_replace
        description: Downloaded MP3 in audio mode or MP4 in video mode, named by the result manifest with its actual extension.
      - name: media_manifest
        type: file
        path_template: "{out}/manifest.json"
        artifact_type: metadata/result-manifest
        mode: create_or_replace
        description: Durable download manifest containing the mode, target, output provenance, hash, and byte count.
    cache:
      mode: none
    isolation:
      mode: subprocess
      network: true
      binaries:
        - yt-dlp
        - ffmpeg
    conditions:
      - kind: requires_input
        input: query
    metadata:
      output_result_manifest: true
      runtime_entrypoint: main
      runtime_file: actions/youtube_audio/run.py
      runtime_module: astrid.packs.youtube.actions.youtube_audio.run
      network_policy:
        allowed_protocols:
          - dns
          - tcp
        allowed_destinations:
          - youtube.com:443
          - www.youtube.com:443
          - youtu.be:443
        allow_redirects: false
        broker:
          host_managed: true
          kind: broker
          enforced: true
          observable: true
          route: youtube-media
          wrapper: yt-dlp
        descendant_enforcement:
          kind: broker
          validated: true
          observable: true
          route: youtube-media
          wrapper: yt-dlp
    resources:
      - kind: implementation
        path: actions/youtube_audio/__init__.py
      - kind: implementation
        path: actions/youtube_audio/run.py
      - kind: documentation
        path: actions/youtube_audio/STAGE.md
resources:
  - kind: documentation
    path: docs/SKILL.md
